name: Publish to npm

on:
  push:
    branches: [master]
  workflow_dispatch:

# id-token: write is REQUIRED for trusted publishing (and provenance) to work.
permissions:
  contents: read
  id-token: write

# Never let two publishes race for the same version. A queued run re-checks the
# registry after the first one finishes, finds the version published, and skips.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
    # `[skip ci]` is already honoured natively by GitHub Actions; `[skip npm]`
    # lets a commit run the other workflows but skip this one. Because `publish`
    # needs this job, skipping here skips the whole workflow.
    if: ${{ !contains(github.event.head_commit.message, '[skip npm]') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Check whether this version is already published
        id: version
        run: |
          set -eu
          pkg="$(node -p "require('./package.json').name")"
          ver="$(node -p "require('./package.json').version")"
          echo "package.json says $pkg@$ver"

          # `npm view <pkg>@<ver> version` exits 0 when the version exists and
          # exits 1 with E404 when it does not.
          if npm view "$pkg@$ver" version >/dev/null 2>&1; then
            echo "$pkg@$ver is already on npm — nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$pkg@$ver is not published yet — will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summary
        run: |
          if [ "${{ steps.version.outputs.publish }}" = "true" ]; then
            echo "### New version to publish :rocket:" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Already published — skipping publish :white_check_mark:" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  publish:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 24 bundles npm >= 11.5.1, the minimum for trusted publishing.
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ssh2 ships its source as-is (no build step). Make sure the entry point
      # actually loads before anything goes to the registry.
      - name: Smoke test
        run: node -e "const m = require('./lib'); if (!m.Client) throw new Error('lib/index.js did not export Client'); console.log('ok')"

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish
        # Belt and braces: this also compares against the registry and no-ops if
        # the version appeared between the `check` job and now.
        run: npx --yes @jsdevtools/npm-publish --access public --provenance
